<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>DAW</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <nav id="menubar" class="menubar"></nav>
      <header class="toolbar">
        <button id="btn-play">Play</button>
        <button id="btn-stop">Stop</button>
        <button id="btn-mixer" aria-pressed="false">Mixer</button>
        <label class="toolbar-control" for="tempo">BPM</label>
        <input id="tempo" class="toolbar-input" type="number" min="20" max="666" step="0.1" value="120" />
        <label class="toolbar-control" for="grid">Grid</label>
        <select id="grid" class="toolbar-select">
          <option value="0">Off</option>
          <option value="1">1/4</option>
          <option value="0.5">1/8</option>
          <option value="0.25" selected>1/16</option>
          <option value="0.125">1/32</option>
        </select>
        <span id="time" class="time">0:00.000</span>
        <span class="spacer"></span>
        <button id="btn-zoom-out" title="Zoom out">−</button>
        <button id="btn-zoom-in" title="Zoom in">+</button>
        <button id="btn-export" class="primary">Export WAV</button>
      </header>
      <main id="stage" class="stage"><canvas id="timeline"></canvas></main>
      <section id="mixer" class="mixer" aria-label="Mixer" hidden></section>
      <footer id="status" class="status">Drop audio files on the timeline. Space plays, Delete removes the selected clip, Ctrl+wheel zooms.</footer>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
