<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>DAW</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <nav id="menubar" class="menubar"></nav>
      <header class="toolbar">
        <button id="btn-play">Play</button>
        <button id="btn-stop">Stop</button>
        <span id="time" class="time">0:00.000</span>
        <span class="spacer"></span>
        <button id="btn-zoom-out" title="Zoom out">−</button>
        <button id="btn-zoom-in" title="Zoom in">+</button>
        <button id="btn-export" class="primary">Export WAV</button>
      </header>
      <main id="stage" class="stage"><canvas id="timeline"></canvas></main>
      <footer id="status" class="status">Drop audio files on the timeline. Space plays, Delete removes the selected clip, Ctrl+wheel zooms.</footer>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
